[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chaos-qa"
version = "0.1.0"
description = "Local chaos monkey and stress-testing tool for AI-generated HTTP code"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "anyio>=4.0.0",
]

[project.scripts]
chaos-qa = "src.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
